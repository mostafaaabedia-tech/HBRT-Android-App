name: Build HBRT Android App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Cordova
        run: npm install -g cordova
        
      - name: Create Project & Add Platform
        run: |
          cordova create hbrt com.hbrt.agro "HBRT AGRO"
          cp index.html hbrt/www/index.html
          cp config.xml hbrt/config.xml
          cd hbrt
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist
          
      - name: Build Debug APK
        run: |
          cd hbrt
          cordova build android --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HBRT-AGRO-App
          path: hbrt/platforms/android/app/build/outputs/apk/debug/app-debug.apk
