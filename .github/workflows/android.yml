name: Build HBRT App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          
      - name: Install Cordova
        run: npm install -g cordova
          
      - name: Build APK
        run: |
          cordova create hbrt com.hbrt.agro "HBRT AGRO"
          cp index.html hbrt/www/index.html
          cd hbrt
          cordova platform add android
          cordova plugin add cordova-plugin-whitelist
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' platforms/android/app/src/main/AndroidManifest.xml
          cordova build android --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HBRT-AGRO-App
          path: hbrt/platforms/android/app/build/outputs/apk/debug/app-debug.apk
