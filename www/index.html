<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>HBRT AGRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0b1410; --card:rgba(18,31,26,0.8); --border:#1f3a2c; --neon:#39FF14; --orange:#FF8C00; --text:#E0E0E0; --muted:#7A9080; --danger:#FF4C4C; }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Space Grotesk',sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
        body { background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
        .app-header { padding:15px 20px; background:var(--bg); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
        .app-header h1 { font-size:24px; color:var(--neon); text-shadow:0 0 10px rgba(57,255,20,0.4); }
        .status-dot { width:10px; height:10px; border-radius:50%; background:var(--danger); transition:0.5s; }
        .status-dot.connected { background:var(--neon); box-shadow:0 0 10px var(--neon); }
        .app-content { flex:1; overflow-y:auto; padding:20px; padding-bottom:80px; }
        .input-row { display:flex; gap:10px; margin-bottom:20px; }
        .ip-input { flex:1; padding:15px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:16px; }
        .connect-btn { padding:15px; border-radius:12px; border:none; background:var(--neon); color:#000; font-weight:700; text-transform:uppercase; }
        .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px; display:flex; flex-direction:column; align-items:center; }
        .stat-card .label { font-size:11px; color:var(--muted); text-transform:uppercase; margin-top:10px; font-weight:700; }
        .stat-val { font-size:32px; font-weight:700; margin-top:5px; }
        .bottom-nav { position:fixed; bottom:0; width:100%; background:#060d0a; border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:15px 0; }
        .nav-btn { background:none; border:none; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; }
        .nav-btn.active { color:var(--neon); }
        .view { display:none; } .view.active { display:block; }
        .ctrl-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .ctrl-btn { padding:15px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:700; text-transform:uppercase; font-size:13px; }
        .ctrl-btn.on { background:var(--neon); color:#000; border-color:var(--neon); }
        .ctrl-btn.warn { background:var(--orange); color:#000; border-color:var(--orange); }
        .ctrl-btn.danger { background:var(--danger); color:#fff; border-color:var(--danger); }
        .ctrl-btn.locked { opacity:0.3; pointer-events:none; }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>HBRT<span style="color:#fff;">.</span></h1>
        <div style="display:flex; align-items:center; gap:8px;">
            <div id="statusDot" class="status-dot"></div>
            <span id="modeBadge" style="font-size:12px; font-weight:700; color:var(--muted);">DISCONNECTED</span>
        </div>
    </header>

    <div class="app-content">
        <div class="view active" id="view-dashboard">
            <div class="input-row">
                <input type="text" id="ipInput" class="ip-input" placeholder="ESP32 IP (e.g. 192.168.1.50)">
                <button id="connectBtn" class="connect-btn">CONNECT</button>
            </div>
            <div class="stat-grid">
                <div class="stat-card"><div class="label">Air Temp</div><div class="stat-val" id="temp" style="color:var(--orange);">--</div></div>
                <div class="stat-card"><div class="label">Humidity</div><div class="stat-val" id="hum" style="color:var(--neon);">--</div></div>
                <div class="stat-card"><div class="label">Soil Moist</div><div class="stat-val" id="soil" style="color:#2E8B57;">--</div></div>
                <div class="stat-card"><div class="label">Water Tank</div><div class="stat-val" id="water" style="color:#00aaff;">--</div></div>
            </div>
        </div>

        <div class="view" id="view-controls">
            <h2 style="margin-bottom:20px; color:var(--neon);">Manual Overrides</h2>
            <button class="ctrl-btn" id="modeBtn" style="width:100%; margin-bottom:15px;">Switch to Manual</button>
            <div class="ctrl-grid">
                <button class="ctrl-btn" id="fanBtn" data-device="fan">Fan: OFF</button>
                <button class="ctrl-btn" id="pumpBtn" data-device="pump">Pump: OFF</button>
                <button class="ctrl-btn" id="lightsBtn" data-device="lights">Lights: OFF</button>
                <button class="ctrl-btn" id="heaterBtn" data-device="heater">Heater: OFF</button>
                <button class="ctrl-btn" id="ventBtn" data-device="servo" style="grid-column:span 2;">Vent: CLOSED</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="controls">Controls</button>
    </nav>

    <script>
        const $ = id => document.getElementById(id);
        let ws, currentAutoMode = true;

        function connectESP() {
            const ip = $('ipInput').value.trim();
            if (!ip) return alert("Enter ESP32 IP");
            if (ws) ws.close();
            $('modeBadge').textContent = "CONNECTING...";
            ws = new WebSocket('ws://' + ip + ':81');

            ws.onopen = () => {
                $('statusDot').classList.add('connected');
                $('modeBadge').textContent = "AUTO";
            };

            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                updateUI(d);
            };

            ws.onclose = () => {
                $('statusDot').classList.remove('connected');
                $('modeBadge').textContent = "DISCONNECTED";
            };
        }

        function sendCmd(device, value) {
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ device, value }));
        }

        function updateUI(d) {
            currentAutoMode = d.auto;
            $('modeBadge').textContent = currentAutoMode ? 'AUTO' : 'MANUAL';
            $('modeBtn').textContent = currentAutoMode ? 'Switch to Manual' : 'Switch to Auto';
            $('modeBtn').className = 'ctrl-btn ' + (currentAutoMode ? 'on' : '');
            
            $('temp').textContent = d.temperature.toFixed(1) + "°C";
            $('hum').textContent = d.humidity.toFixed(1) + "%";
            $('soil').textContent = d.soil + "%";
            $('water').textContent = d.water + "%";
            
            $('fanBtn').textContent = `Fan: ${d.fan ? 'ON' : 'OFF'}`; $('fanBtn').className = 'ctrl-btn ' + (d.fan ? 'warn' : '') + (currentAutoMode ? ' locked' : '');
            $('pumpBtn').textContent = `Pump: ${d.pump ? 'ON' : 'OFF'}`; $('pumpBtn').className = 'ctrl-btn ' + (d.pump ? 'danger' : '') + (currentAutoMode ? ' locked' : '');
            $('lightsBtn').textContent = `Lights: ${d.lights ? 'ON' : 'OFF'}`; $('lightsBtn').className = 'ctrl-btn ' + (d.lights ? 'warn' : '') + (currentAutoMode ? ' locked' : '');
            $('heaterBtn').textContent = `Heater: ${d.heater ? 'ON' : 'OFF'}`; $('heaterBtn').className = 'ctrl-btn ' + (d.heater ? 'warn' : '') + (currentAutoMode ? ' locked' : '');
            $('ventBtn').textContent = `Vent: ${d.servo ? 'OPEN' : 'CLOSED'}`; $('ventBtn').className = 'ctrl-btn ' + (d.servo ? 'warn' : '') + (currentAutoMode ? ' locked' : '');
        }

        document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            $('view-' + btn.dataset.view).classList.add('active');
            btn.classList.add('active');
        }));

        $('connectBtn').addEventListener('click', connectESP);
        $('modeBtn').addEventListener('click', () => sendCmd('auto', !currentAutoMode));
        document.querySelectorAll('.ctrl-btn[data-device]').forEach(btn => btn.addEventListener('click', () => {
            const dev = btn.dataset.device; let state = false;
            if(dev === 'fan' || dev === 'servo' || dev === 'lights' || dev === 'heater') state = btn.classList.contains('warn');
            if(dev === 'pump') state = btn.classList.contains('danger');
            sendCmd(dev, !state);
        }));
    </script>
</body>
</html>
</html>
